<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Audio Experience</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #ar-button { 
            position: absolute; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            padding: 12px 24px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 100;
        }
        #ar-button:disabled { background: #444; cursor: not-allowed; }
        #next-button { 
            position: absolute; 
            bottom: 20px; 
            right: 20px;
            padding: 12px 24px;
            background: #34c759;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 100;
        }
        #info { 
            position: absolute; 
            top: 20px; 
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        #fallback-info { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 80%;
            z-index: 1000;
            display: none;
        }
        #fallback-info.show { display: block; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="info">Mode: <span id="mode-label">Web 3D</span></div>
    <button id="ar-button" disabled>Start AR</button>
    <button id="next-button">Next Track</button>
    <div id="fallback-info">
        <h3>AR Not Available</h3>
        <p>Camera access denied or not supported. Using 3D fallback mode.</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mind-ar": "https://unpkg.com/mind-ar@1.2.5/dist/mindar-threejs.prod.js",
                "mind-ar-image": "https://unpkg.com/mind-ar@1.2.5/dist/mindar-image.prod.js"
            }
        }
    </script>

    <script type="module">
        // ============================================
        // AR Audio Experience - Main Application
        // ============================================

        // Configuration
        const CONFIG = {
            // Audio tracks - replace with your actual audio URLs
            audioTracks: [
                'audio/track-01.mp3',
                'audio/track-02.mp3',
                'audio/track-03.mp3'
            ],
            // Video overlay - replace with your actual video URL
            videoSrc: 'video/overlay.webm',
            // MindAR target file - compile with: npx mind-ar-node-tools.createTarget --image-target ./targets/tag.jpg --output ./targets/tag.mind
            targetSrc: 'targets/tag.mind',
            // Alpha mode: 'webm' for WebM VP9 with alpha, 'sideband' for RGB+alpha split
            ALPHA_MODE: 'webm',
            // Model - optional glTF model, or null for procedural geometry
            modelSrc: null // 'models/model.glb'
        };

        // State
        let currentTrackIndex = 0;
        let audioContext = null;
        let audioBuffers = [];
        let currentSource = null;
        let isPlaying = false;
        let stage = null; // Shared THREE.Group between AR and Web modes
        let renderer = null;
        let mindarThree = null;
        let arCamera = null;
        let webCamera = null;
        let scene = null;
        let videoElement = null;
        let videoTexture = null;
        let videoPlane = null;
        let object3D = null;
        let pannerNode = null;

        // DOM Elements
        const arButton = document.getElementById('ar-button');
        const nextButton = document.getElementById('next-button');
        const modeLabel = document.getElementById('mode-label');
        const fallbackInfo = document.getElementById('fallback-info');

        // ============================================
        // Initialization
        // ============================================

        async function init() {
            console.log('Initializing AR Audio Experience...');
            
            // Initialize Audio Context (must be triggered by user gesture)
            await initAudio();
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio || 1);
            document.body.appendChild(renderer.domElement);
            
            // Create shared stage (will be used by both AR and Web modes)
            stage = new THREE.Group();
            
            // Initialize video element and texture
            videoElement = document.createElement('video');
            videoElement.loop = true;
            videoElement.muted = true;
            videoElement.playsInline = true;
            videoElement.crossOrigin = 'anonymous';
            videoElement.src = CONFIG.videoSrc;
            
            videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.colorSpace = THREE.SRGBColorSpace;
            
            // Handle alpha channel based on mode
            if (CONFIG.ALPHA_MODE === 'sideband') {
                videoTexture.format = THREE.RGBAFormat;
                // Custom shader material for sideband alpha
                const sidebandMaterial = new THREE.ShaderMaterial({
                    uniforms: {
                        map: { value: videoTexture },
                        resolution: { value: new THREE.Vector2(videoElement.videoWidth || 1, videoElement.videoHeight || 1) }
                    },
                    vertexShader: `
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform sampler2D map;
                        uniform vec2 resolution;
                        varying vec2 vUv;
                        void main() {
                            vec2 texCoord = vUv;
                            // Sideband: RGB in top half, alpha in bottom half
                            vec2 rgbTexCoord = vec2(texCoord.x, texCoord.y * 0.5);
                            vec2 alphaTexCoord = vec2(texCoord.x, 0.5 + texCoord.y * 0.5);
                            vec4 rgbColor = texture2D(map, rgbTexCoord);
                            float alpha = texture2D(map, alphaTexCoord).r;
                            gl_FragColor = vec4(rgbColor.rgb, alpha);
                        }
                    `,
                    transparent: true
                });
                createVideoPlane(sidebandMaterial);
            } else {
                // WebM with alpha - standard approach
                videoTexture.format = THREE.RGBAFormat;
                videoTexture.transparent = true;
                createVideoPlane(new THREE.MeshBasicMaterial({ map: videoTexture, transparent: true }));
            }
            
            // Create 3D object (procedural icosahedron as default)
            create3DObject();
            
            // Setup lighting
            setupLighting();
            
            // Initialize Web 3D mode first
            await initWebMode();
            
            // Setup event listeners
            setupEventListeners();
            
            // Enable AR button
            arButton.disabled = false;
            
            console.log('Initialization complete.');
            
            // Start rendering
            animate();
        }

        // ============================================
        // Audio System
        // ============================================

        async function initAudio() {
            // Create audio context (will be resumed on first user gesture)
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Create panner node for spatial audio
            pannerNode = audioContext.createStereoPanner();
            pannerNode.connect(audioContext.destination);
            
            // Preload audio buffers
            await preloadAudioBuffers();
        }

        async function preloadAudioBuffers() {
            for (const url of CONFIG.audioTracks) {
                try {
                    const response = await fetch(url);
                    const arrayBuffer = await response.arrayBuffer();
                    const buffer = await audioContext.decodeAudioData(arrayBuffer);
                    audioBuffers.push(buffer);
                    console.log(`Loaded audio: ${url}`);
                } catch (error) {
                    console.warn(`Failed to load audio: ${url}`, error);
                    // Create a silent buffer as fallback
                    const silentBuffer = audioContext.createBuffer(1, 1, audioContext.sampleRate);
                    audioBuffers.push(silentBuffer);
                }
            }
        }

        function playTrack(index) {
            // Stop current track
            if (currentSource) {
                currentSource.stop();
                currentSource.disconnect();
                currentSource = null;
            }
            
            if (index >= 0 && index < audioBuffers.length) {
                currentTrackIndex = index;
                const buffer = audioBuffers[index];
                
                currentSource = audioContext.createBufferSource();
                currentSource.buffer = buffer;
                currentSource.connect(pannerNode);
                currentSource.onended = () => {
                    isPlaying = false;
                    // Auto-advance to next track
                    playTrack((currentTrackIndex + 1) % audioBuffers.length);
                };
                
                // Resume audio context if suspended (required by browsers)
                if (audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        currentSource.start(0);
                        isPlaying = true;
                        videoElement.play().catch(e => console.warn('Video play failed:', e));
                    });
                } else {
                    currentSource.start(0);
                    isPlaying = true;
                    videoElement.play().catch(e => console.warn('Video play failed:', e));
                }
            }
        }

        function togglePlayPause() {
            if (isPlaying) {
                // Can't pause BufferSource, so we stop and remember position
                // For simplicity, we just stop here
                if (currentSource) {
                    currentSource.stop();
                    currentSource.disconnect();
                    currentSource = null;
                }
                isPlaying = false;
                videoElement.pause();
            } else {
                playTrack(currentTrackIndex);
            }
        }

        // ============================================
        // Video Plane
        // ============================================

        function createVideoPlane(material) {
            const geometry = new THREE.PlaneGeometry(1, 1);
            videoPlane = new THREE.Mesh(geometry, material);
            videoPlane.position.set(0, 0, 0);
            stage.add(videoPlane);
        }

        // ============================================
        // 3D Object
        // ============================================

        async function create3DObject() {
            if (CONFIG.modelSrc) {
                try {
                    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
                    const loader = new GLTFLoader();
                    const gltf = await loader.loadAsync(CONFIG.modelSrc);
                    object3D = gltf.scene;
                    // Scale and position the model
                    object3D.scale.set(0.5, 0.5, 0.5);
                    object3D.position.set(0, 0.1, 0);
                    stage.add(object3D);
                    console.log('Loaded glTF model:', CONFIG.modelSrc);
                } catch (error) {
                    console.warn('Failed to load glTF model, using procedural geometry:', error);
                    createProceduralObject();
                }
            } else {
                createProceduralObject();
            }
        }

        function createProceduralObject() {
            const geometry = new THREE.IcosahedronGeometry(0.2, 0);
            const material = new THREE.MeshStandardMaterial({
                color: 0x007aff,
                metalness: 0.7,
                roughness: 0.3
            });
            object3D = new THREE.Mesh(geometry, material);
            object3D.position.set(0, 0.1, 0);
            stage.add(object3D);
        }

        // ============================================
        // Lighting
        // ============================================

        function setupLighting() {
            // Ambient light
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            stage.add(ambientLight);
            
            // Directional light
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 1);
            stage.add(directionalLight);
            
            // Hemisphere light for natural look
            const hemisphereLight = new THREE.HemisphereLight(0xffffbb, 0x080820, 0.6);
            stage.add(hemisphereLight);
        }

        // ============================================
        // Web 3D Mode (Fallback)
        // ============================================

        async function initWebMode() {
            console.log('Initializing Web 3D mode...');
            
            scene = new THREE.Scene();
            scene.add(stage);
            
            // Create camera
            webCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            webCamera.position.set(0, 0, 2);
            
            // Add orbit controls for the web mode
            const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
            const controls = new OrbitControls(webCamera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Add a simple background
            scene.background = new THREE.Color(0x111122);
            
            // Add grid helper
            const gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);
            
            modeLabel.textContent = 'Web 3D';
            console.log('Web 3D mode ready.');
        }

        // ============================================
        // AR Mode (MindAR)
        // ============================================

        async function initARMode() {
            console.log('Initializing AR mode...');
            
            try {
                // Import MindAR
                const { MindARThree } = await import('mind-ar');
                const { MindARImageTarget } = await import('mind-ar-image');
                
                mindarThree = new MindARThree({
                    container: renderer.domElement,
                    camera: webCamera
                });
                
                // Load target
                const { loadImageTarget } = await import('mind-ar-image');
                const target = await loadImageTarget(CONFIG.targetSrc);
                
                // Create AR scene
                const arScene = new THREE.Scene();
                
                // Add the shared stage to AR scene
                arScene.add(stage);
                
                // Setup AR
                mindarThree.addAnchor(0, target, arScene);
                
                // Start AR
                await mindarThree.start();
                
                // Hide web camera, use AR camera
                arCamera = mindarThree.camera;
                
                modeLabel.textContent = 'AR Mode';
                fallbackInfo.classList.remove('show');
                
                console.log('AR mode started successfully.');
                
                return true;
            } catch (error) {
                console.error('Failed to start AR mode:', error);
                fallbackInfo.classList.add('show');
                return false;
            }
        }

        function stopARMode() {
            if (mindarThree) {
                mindarThree.stop();
                mindarThree = null;
            }
            modeLabel.textContent = 'Web 3D';
            console.log('AR mode stopped.');
        }

        // ============================================
        // Event Listeners
        // ============================================

        function setupEventListeners() {
            // AR button
            arButton.addEventListener('click', async () => {
                // Stop current audio
                if (currentSource) {
                    currentSource.stop();
                    currentSource.disconnect();
                    currentSource = null;
                }
                
                // Try to start AR
                const success = await initARMode();
                if (!success) {
                    // Fallback to web mode
                    stopARMode();
                }
            });
            
            // Next button
            nextButton.addEventListener('click', () => {
                const nextIndex = (currentTrackIndex + 1) % audioBuffers.length;
                playTrack(nextIndex);
            });
            
            // Video plane click to toggle play/pause
            videoPlane.userData.clickable = true;
            
            // Raycaster for object interaction (simplified)
            renderer.domElement.addEventListener('click', (event) => {
                // Resume audio context on any click (browser requirement)
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                
                // If not playing, start from current track
                if (!isPlaying && audioBuffers.length > 0) {
                    playTrack(currentTrackIndex);
                }
            });
            
            // Window resize
            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                
                if (webCamera) {
                    webCamera.aspect = window.innerWidth / window.innerHeight;
                    webCamera.updateProjectionMatrix();
                }
                
                if (arCamera) {
                    arCamera.aspect = window.innerWidth / window.innerHeight;
                    arCamera.updateProjectionMatrix();
                }
            });
            
            // Visibility change - pause when tab is hidden
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') {
                    if (currentSource) {
                        currentSource.stop();
                        currentSource.disconnect();
                        currentSource = null;
                    }
                    isPlaying = false;
                    videoElement.pause();
                }
            });
        }

        // ============================================
        // Animation Loop
        // ============================================

        function animate() {
            requestAnimationFrame(animate);
            
            // Update video texture
            if (videoTexture) {
                videoTexture.needsUpdate = true;
            }
            
            // Rotate 3D object for visual interest
            if (object3D) {
                object3D.rotation.y += 0.01;
            }
            
            // Update panner position based on object position (for spatial audio)
            if (pannerNode && object3D) {
                // Simple stereo panning based on x position
                pannerNode.pan.value = object3D.position.x * 0.5;
            }
            
            // Render appropriate scene
            if (mindarThree && mindarThree.renderer) {
                // AR mode - MindAR handles rendering
                mindarThree.renderer.render(mindarThree.scene, mindarThree.camera);
            } else if (scene && webCamera) {
                // Web mode
                renderer.render(scene, webCamera);
            }
        }

        // ============================================
        // Start the application
        // ============================================

        // Handle page visibility - don't start until visible
        if (document.visibilityState === 'visible') {
            init().catch(console.error);
        } else {
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    init().catch(console.error);
                }
            });
        }

        // Expose functions to global scope for debugging
        window.playTrack = playTrack;
        window.togglePlayPause = togglePlayPause;
    </script>
</body>
</html>
