<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PopUp1-AR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        /* Audio-only mode styles */
        .audio-mode {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
            padding: 40px;
            text-align: center;
        }
        
        .audio-mode h1 {
            font-size: 2.5rem;
            font-weight: 300;
            text-align: center;
        }
        
        .audio-mode .subtitle {
            font-size: 1.2rem;
            color: #888;
            text-align: center;
            max-width: 60%;
        }
        
        .track-info {
            font-size: 1.5rem;
            font-weight: 500;
            color: #007aff;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .node-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ccc;
            max-width: 80%;
            margin: 20px 0;
            min-height: 40px;
        }
        
        /* Button containers */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
        }
        
        .primary-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .secondary-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        /* Next/Restart button - primary action */
        .next-button, .restart-button {
            padding: 16px 48px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.4);
        }
        
        .next-button:hover, .restart-button:hover {
            background: #0056cc;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 122, 255, 0.6);
        }
        
        .next-button:active, .restart-button:active {
            transform: translateY(0);
        }
        
        .next-button:disabled, .restart-button:disabled {
            background: #444;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* Back button for audio mode */
        .back-button-audio {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }
        
        .back-button-audio:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .back-button-audio:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Play/Pause button - toggles state */
        .play-pause-button {
            padding: 12px 24px;
            background: #34c759;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(52, 199, 89, 0.4);
        }
        
        .play-pause-button:hover {
            background: #2da74a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(52, 199, 89, 0.6);
        }
        
        .play-pause-button:disabled {
            background: #444;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* Options buttons for branching - styled differently */
        .options-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        
        .option-button {
            padding: 14px 28px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }
        
        .option-button:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.2));
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }
        
        /* Feedback button */
        .feedback-button {
            padding: 12px 24px;
            background: #ff9500;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 149, 0, 0.4);
            margin-top: 20px;
        }
        
        .feedback-button:hover {
            background: #e68a00;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 149, 0, 0.6);
        }
        
        /* Test mode toggle button - only shown on first load */
        .test-mode-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            z-index: 10000;
            transition: all 0.2s ease;
        }
        
        .test-mode-toggle:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }
        
        .test-mode-toggle.hidden {
            display: none;
        }
        
        /* Full AR mode styles (hidden by default) */
        #ar-container {
            display: none;
            width: 100%;
            height: 100%;
        }
        
        #ar-container.active {
            display: block;
        }
        
        #ar-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 100;
        }
        
        #ar-button:disabled {
            background: #444;
            cursor: not-allowed;
        }
        
        #next-button-ar {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            background: #34c759;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 100;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
        }
        
        #fallback-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 80%;
            z-index: 1000;
            display: none;
        }
        
        #fallback-info.show {
            display: block;
        }
        
        canvas {
            display: block;
        }
        
        /* Back to audio mode button */
        .back-button {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            z-index: 1000;
        }
        
        .back-button:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: #666;
        }
        
        /* Loading indicator */
        .loading {
            display: none;
            text-align: center;
            font-size: 1.2rem;
            color: #888;
        }
        
        .loading.active {
            display: block;
        }
        
        /* Preload progress */
        .preload-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
        }
        
        .preload-progress .bar {
            height: 100%;
            background: #007aff;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .preload-progress.complete {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .preload-status {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 10001;
            display: none;
        }
        
        .preload-status.active {
            display: block;
        }
        
        .preload-status.complete {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <!-- Preload progress bar -->
    <div class="preload-progress" id="preload-progress">
        <div class="bar" id="preload-bar"></div>
    </div>
    <div class="preload-status" id="preload-status"></div>
    
    <!-- Audio-only mode (default) -->
    <div id="audio-mode" class="audio-mode">
        <h1 id="node-title">PopUp1</h1>
        <p class="subtitle" id="node-subtitle">Click "Next" to experience the story through sound</p>
        <div class="track-info" id="node-id">start</div>
        <div class="node-text" id="node-text"></div>
        
        <!-- Options appear here when node has branching -->
        <div class="options-container" id="options-container"></div>
        
        <!-- Primary buttons (Next or Options) -->
        <div class="button-container">
            <div class="primary-buttons">
                <button id="next-button-simple" class="next-button" disabled>Next</button>
                <button id="restart-button" class="restart-button" style="display: none;">Restart</button>
            </div>
            <div class="secondary-buttons">
                <button id="back-button-audio" class="back-button-audio" disabled>Back</button>
                <button id="play-pause-button" class="play-pause-button">Play</button>
            </div>
        </div>
        
        <!-- Feedback button (shown only at ending) -->
        <button id="feedback-button" class="feedback-button" style="display: none;">Give Feedback</button>
        
        <div class="loading" id="loading">Loading...</div>
    </div>
    
    <!-- Test mode toggle - shown only on first load -->
    <button id="test-mode-toggle" class="test-mode-toggle">Test Mode</button>
    
    <!-- Full AR mode (hidden by default) -->
    <div id="ar-container">
        <button id="back-button" class="back-button">Back to Audio</button>
        <div id="info">Mode: <span id="mode-label">Web 3D</span></div>
        <button id="ar-button" disabled>Start AR</button>
        <button id="next-button-ar">Next Track</button>
        <div id="fallback-info">
            <h3>AR Not Available</h3>
            <p>Camera access denied or not supported. Using 3D fallback mode.</p>
        </div>
    </div>

    <!-- Load configuration first -->
    <script src="config.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mind-ar": "https://unpkg.com/mind-ar@1.2.5/dist/mindar-threejs.prod.js",
                "mind-ar-image": "https://unpkg.com/mind-ar@1.2.5/dist/mindar-image.prod.js"
            }
        }
    </script>

    <script type="module">
        // ============================================
        // PopUp1-AR - Dual Mode Application
        // Uses external config.js for content configuration
        // ============================================

        // ============================================
        // AUDIO LOADER
        // Handles preloading and caching of audio files
        // ============================================

        class AudioLoader {
            constructor(config) {
                this.config = config;
                this.audioContext = null;
                this.audioBuffers = {};
                this.loadingPromises = {};
                this.totalFiles = 0;
                this.loadedFiles = 0;
                this.onProgress = null;
                this.onComplete = null;
            }
            
            init(audioContext) {
                this.audioContext = audioContext;
            }
            
            extractAudioURLs(tree) {
                const urls = new Set();
                Object.values(tree).forEach(node => {
                    if (typeof node.audio === 'string') {
                        urls.add(node.audio);
                    }
                });
                return Array.from(urls);
            }
            
            async preload(tree) {
                const urls = this.extractAudioURLs(tree);
                this.totalFiles = urls.length;
                this.loadedFiles = 0;
                
                if (this.totalFiles === 0) {
                    this.onComplete && this.onComplete();
                    return Promise.resolve();
                }
                
                const promises = urls.map(url => this.loadAudio(url));
                await Promise.all(promises);
                
                this.onComplete && this.onComplete();
            }
            
            async loadAudio(url) {
                if (this.audioBuffers[url]) {
                    this.updateProgress();
                    return;
                }
                
                if (this.loadingPromises[url]) {
                    await this.loadingPromises[url];
                    return;
                }
                
                this.loadingPromises[url] = new Promise(async (resolve) => {
                    try {
                        if (url.startsWith('data:')) {
                            const response = await fetch(url);
                            const arrayBuffer = await response.arrayBuffer();
                            const buffer = await this.audioContext.decodeAudioData(arrayBuffer);
                            this.audioBuffers[url] = buffer;
                            this.updateProgress();
                            resolve();
                            return;
                        }
                        
                        try {
                            const response = await fetch(url);
                            if (!response.ok) throw new Error(`HTTP ${response.status}`);
                            const arrayBuffer = await response.arrayBuffer();
                            const buffer = await this.audioContext.decodeAudioData(arrayBuffer);
                            this.audioBuffers[url] = buffer;
                            this.updateProgress();
                            resolve();
                        } catch (error) {
                            console.warn(`Direct fetch failed for ${url}, trying with credentials:`, error);
                            const response = await fetch(url, { credentials: 'same-origin' });
                            const arrayBuffer = await response.arrayBuffer();
                            const buffer = await this.audioContext.decodeAudioData(arrayBuffer);
                            this.audioBuffers[url] = buffer;
                            this.updateProgress();
                            resolve();
                        }
                    } catch (error) {
                        console.error(`Failed to load audio: ${url}`, error);
                        const silentBuffer = this.audioContext.createBuffer(1, 1, this.audioContext.sampleRate);
                        this.audioBuffers[url] = silentBuffer;
                        this.updateProgress();
                        resolve();
                    } finally {
                        delete this.loadingPromises[url];
                    }
                });
                
                await this.loadingPromises[url];
            }
            
            getBuffer(url) {
                return this.audioBuffers[url];
            }
            
            updateProgress() {
                this.loadedFiles++;
                const progress = Math.round((this.loadedFiles / this.totalFiles) * 100);
                this.onProgress && this.onProgress(progress, this.loadedFiles, this.totalFiles);
            }
        }

        // ============================================
        // AUDIO TREE NAVIGATION ENGINE
        // ============================================

        class AudioTreePlayer {
            constructor(tree, config) {
                this.tree = tree;
                this.config = config;
                this.currentNodeId = config.defaultStartNode || 'start';
                this.audioContext = null;
                this.masterGain = null;
                this.currentSources = [];
                this.isPlaying = false;
                this.isPaused = false;
                this.audioLoader = new AudioLoader(config);
                this.preloaded = false;
                this.history = [];
                
                this.initAudio();
            }
            
            initAudio() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.audioContext.createGain();
                this.masterGain.gain.value = this.config.audio.masterVolume || 0.5;
                this.masterGain.connect(this.audioContext.destination);
                this.audioLoader.init(this.audioContext);
            }
            
            async preload() {
                if (this.config.audio.preloadAudio !== false) {
                    await this.audioLoader.preload(this.tree);
                    this.preloaded = true;
                }
            }
            
            getCurrentNode() {
                return this.tree[this.currentNodeId];
            }
            
            getNode(nodeId) {
                return this.tree[nodeId];
            }
            
            goTo(nodeId, pushToHistory = true) {
                if (this.tree[nodeId]) {
                    if (pushToHistory && this.currentNodeId) {
                        this.history.push(this.currentNodeId);
                    }
                    this.stopAll();
                    this.currentNodeId = nodeId;
                    return true;
                }
                return false;
            }
            
            canGoBack() {
                return this.history.length > 0;
            }
            
            goBack() {
                if (this.history.length > 0) {
                    const previousNodeId = this.history.pop();
                    this.stopAll();
                    this.currentNodeId = previousNodeId;
                    return true;
                }
                return false;
            }
            
            next() {
                const currentNode = this.getCurrentNode();
                if (currentNode.options && currentNode.options.length > 0) {
                    return false;
                }
                if (currentNode.next) {
                    this.goTo(currentNode.next);
                    return true;
                }
                return false;
            }
            
            chooseOption(optionNodeId) {
                const currentNode = this.getCurrentNode();
                if (currentNode.options && currentNode.options.includes(optionNodeId)) {
                    this.goTo(optionNodeId);
                    return true;
                }
                return false;
            }
            
            async play() {
                const node = this.getCurrentNode();
                if (!node) return;
                
                this.stopAll();
                
                if (this.audioContext.state === 'suspended') {
                    await this.audioContext.resume();
                }
                
                await this.playNodeAudio(node);
                this.isPlaying = true;
                this.isPaused = false;
            }
            
            pause() {
                this.stopAll();
                this.isPaused = true;
                this.isPlaying = false;
            }
            
            togglePlayPause() {
                if (this.isPaused) {
                    this.play();
                } else if (this.isPlaying) {
                    this.pause();
                } else {
                    this.play();
                }
            }
            
            async playNodeAudio(node) {
                if (!node.audio) return;
                
                if (typeof node.audio === 'string') {
                    await this.playAudioURL(node.audio);
                } else if (node.audio.type === 'tone') {
                    this.playTone(node.audio);
                } else if (node.audio.type === 'sequence') {
                    this.playSequence(node.audio);
                }
            }
            
            async playAudioURL(url) {
                const buffer = this.audioLoader.getBuffer(url);
                
                if (!buffer) {
                    console.warn(`Audio buffer not preloaded for ${url}, loading now...`);
                    await this.audioLoader.loadAudio(url);
                }
                
                const source = this.audioContext.createBufferSource();
                source.buffer = this.audioLoader.getBuffer(url);
                source.connect(this.masterGain);
                
                source.start();
                
                this.currentSources.push(source);
                
                source.onended = () => {
                    this.cleanupSource(source);
                    this.isPlaying = false;
                    this.isPaused = false;
                };
            }
            
            playTone(config) {
                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                
                osc.type = config.wave || 'sine';
                osc.frequency.value = config.frequency || 440;
                
                gain.gain.value = 0;
                gain.gain.linearRampToValueAtTime(
                    config.volume || 0.5, 
                    this.audioContext.currentTime + 0.05
                );
                
                const endTime = this.audioContext.currentTime + (config.duration || 2);
                gain.gain.linearRampToValueAtTime(0, endTime);
                
                osc.connect(gain);
                gain.connect(this.masterGain);
                
                osc.start();
                osc.stop(endTime);
                
                this.currentSources.push(osc, gain);
                
                setTimeout(() => this.cleanupSource(osc, gain), (config.duration || 2) * 1000);
            }
            
            playSequence(config) {
                let currentTime = this.audioContext.currentTime;
                
                config.notes.forEach(note => {
                    if (note.freq === 0) {
                        currentTime += note.dur || 0.2;
                        return;
                    }
                    
                    const osc = this.audioContext.createOscillator();
                    const gain = this.audioContext.createGain();
                    
                    osc.type = note.wave || config.wave || 'sine';
                    osc.frequency.value = note.freq || 440;
                    
                    gain.gain.value = 0;
                    const attackTime = currentTime + 0.02;
                    gain.gain.linearRampToValueAtTime(note.volume || 0.4, attackTime);
                    
                    const releaseStart = currentTime + (note.dur || 0.2) - 0.05;
                    gain.gain.linearRampToValueAtTime(0, releaseStart);
                    
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    
                    osc.start(currentTime);
                    osc.stop(currentTime + (note.dur || 0.2));
                    
                    this.currentSources.push(osc, gain);
                    
                    currentTime += note.dur || 0.2;
                });
                
                const totalDuration = config.notes.reduce((sum, note) => sum + (note.dur || 0.2), 0);
                setTimeout(() => {
                    this.isPlaying = false;
                    this.isPaused = false;
                }, totalDuration * 1000);
            }
            
            cleanupSource(...sources) {
                sources.forEach(source => {
                    try {
                        source.stop();
                        source.disconnect();
                    } catch (e) {}
                });
                this.currentSources = this.currentSources.filter(s => !sources.includes(s));
            }
            
            stopAll() {
                this.currentSources.forEach(source => {
                    try {
                        source.stop();
                        source.disconnect();
                    } catch (e) {}
                });
                this.currentSources = [];
                this.isPlaying = false;
                this.isPaused = false;
            }
            
            cleanup() {
                this.stopAll();
                if (this.audioContext) {
                    this.audioContext.close().catch(() => {});
                }
            }
            
            getFeedbackUrl() {
                const node = this.getCurrentNode();
                return node ? node.feedbackUrl : null;
            }
            
            isEndingNode() {
                const node = this.getCurrentNode();
                return node && node.id === 'ending';
            }
        }

        // ============================================
        // APPLICATION STATE
        // ============================================

        const TEST_MODE_KEY = APP_CONFIG.testModeStorageKey || 'popup1-ar-test-mode';
        let isTestMode = localStorage.getItem(TEST_MODE_KEY) === 'true';
        
        // DOM Elements
        const audioModeEl = document.getElementById('audio-mode');
        const arContainerEl = document.getElementById('ar-container');
        const testModeToggle = document.getElementById('test-mode-toggle');
        const nodeTitleEl = document.getElementById('node-title');
        const nodeSubtitleEl = document.getElementById('node-subtitle');
        const nodeIdEl = document.getElementById('node-id');
        const nodeTextEl = document.getElementById('node-text');
        const optionsContainerEl = document.getElementById('options-container');
        const loadingEl = document.getElementById('loading');
        const nextButtonSimple = document.getElementById('next-button-simple');
        const restartButton = document.getElementById('restart-button');
        const backButtonSimple = document.getElementById('back-button-audio');
        const playPauseButton = document.getElementById('play-pause-button');
        const feedbackButton = document.getElementById('feedback-button');
        const backButton = document.getElementById('back-button');
        const preloadProgressEl = document.getElementById('preload-progress');
        const preloadBarEl = document.getElementById('preload-bar');
        const preloadStatusEl = document.getElementById('preload-status');

        let audioTreePlayer = null;

        // ============================================
        // AUDIO-ONLY MODE
        // ============================================

        async function initAudioMode() {
            audioModeEl.style.display = 'flex';
            arContainerEl.classList.remove('active');
            
            audioTreePlayer = new AudioTreePlayer(AUDIO_TREE, APP_CONFIG);
            
            loadingEl.classList.add('active');
            loadingEl.textContent = UI_TEXT.loadingAudio || 'Loading audio...';
            
            if (APP_CONFIG.audio.preloadAudio !== false) {
                preloadProgressEl.classList.remove('complete');
                preloadStatusEl.classList.add('active');
                
                audioTreePlayer.audioLoader.onProgress = (progress, loaded, total) => {
                    preloadBarEl.style.width = `${progress}%`;
                    preloadStatusEl.textContent = `Loading ${loaded}/${total} audio files...`;
                };
                
                audioTreePlayer.audioLoader.onComplete = () => {
                    preloadProgressEl.classList.add('complete');
                    preloadStatusEl.classList.add('complete');
                    setTimeout(() => {
                        preloadStatusEl.classList.remove('active');
                    }, 500);
                    
                    loadingEl.classList.remove('active');
                    updateAudioModeUI();
                    nextButtonSimple.disabled = false;
                    audioTreePlayer.play();
                };
                
                await audioTreePlayer.preload();
            } else {
                loadingEl.classList.remove('active');
                updateAudioModeUI();
                nextButtonSimple.disabled = false;
                audioTreePlayer.play();
            }
            
            nextButtonSimple.textContent = UI_TEXT.nextButton || 'Next';
            restartButton.textContent = UI_TEXT.nextButton || 'Restart';
            backButtonSimple.textContent = UI_TEXT.backButton || 'Back';
            playPauseButton.textContent = UI_TEXT.playButton || 'Play';
            feedbackButton.textContent = UI_TEXT.feedbackButton || 'Give Feedback';
        }
        
        function updateAudioModeUI() {
            const node = audioTreePlayer.getCurrentNode();
            if (!node) return;
            
            nodeTitleEl.textContent = node.title || '';
            nodeSubtitleEl.textContent = node.subtitle || '';
            nodeIdEl.textContent = node.id || '';
            nodeIdEl.style.color = node.color || THEME.primary;
            nodeTextEl.textContent = node.text || '';
            
            renderOptions();
            updateButtonStates();
            
            if (node.background) {
                audioModeEl.style.background = node.background;
            } else {
                audioModeEl.style.background = '';
            }
            
            if (node.background && isDarkColor(node.background)) {
                nodeTextEl.style.color = '#ccc';
            } else {
                nodeTextEl.style.color = '#333';
            }
            
            // Show/hide feedback button
            if (node.feedbackUrl) {
                feedbackButton.style.display = 'block';
                feedbackButton.onclick = () => {
                    window.open(node.feedbackUrl, '_blank');
                };
            } else {
                feedbackButton.style.display = 'none';
            }
            
            updatePlayPauseButton();
        }
        
        function updateButtonStates() {
            backButtonSimple.disabled = !audioTreePlayer.canGoBack();
            
            // Show restart button at ending, next button otherwise
            const isEnding = audioTreePlayer.isEndingNode();
            nextButtonSimple.style.display = isEnding ? 'none' : 'block';
            restartButton.style.display = isEnding ? 'block' : 'none';
        }
        
        function updatePlayPauseButton() {
            if (audioTreePlayer.isPaused) {
                playPauseButton.textContent = UI_TEXT.playButton || 'Play';
            } else if (audioTreePlayer.isPlaying) {
                playPauseButton.textContent = UI_TEXT.pauseButton || 'Pause';
            } else {
                playPauseButton.textContent = UI_TEXT.playButton || 'Play';
            }
        }
        
        function renderOptions() {
            const node = audioTreePlayer.getCurrentNode();
            optionsContainerEl.innerHTML = '';
            
            if (node.options && node.options.length > 0) {
                node.options.forEach(optionId => {
                    const optionNode = audioTreePlayer.getNode(optionId);
                    if (optionNode) {
                        const button = document.createElement('button');
                        button.className = 'option-button';
                        button.textContent = optionNode.title || optionId;
                        button.style.borderColor = optionNode.color || THEME.primary;
                        button.addEventListener('click', () => {
                            audioTreePlayer.chooseOption(optionId);
                            updateAudioModeUI();
                            audioTreePlayer.play();
                        });
                        optionsContainerEl.appendChild(button);
                    }
                });
            }
        }
        
        async function nextSimpleTrack() {
            nextButtonSimple.disabled = true;
            
            const didAdvance = audioTreePlayer.next();
            if (didAdvance) {
                updateAudioModeUI();
                await audioTreePlayer.play();
            } else {
                audioTreePlayer.goTo('start');
                updateAudioModeUI();
                await audioTreePlayer.play();
            }
            
            nextButtonSimple.disabled = false;
        }
        
        async function restartExperience() {
            restartButton.disabled = true;
            audioTreePlayer.goTo('start', false); // Don't push start to history
            audioTreePlayer.history = []; // Clear history
            updateAudioModeUI();
            await audioTreePlayer.play();
            restartButton.disabled = false;
        }
        
        async function backTrack() {
            backButtonSimple.disabled = true;
            
            const didGoBack = audioTreePlayer.goBack();
            if (didGoBack) {
                updateAudioModeUI();
                await audioTreePlayer.play();
            }
            
            backButtonSimple.disabled = false;
        }
        
        function togglePlayPause() {
            audioTreePlayer.togglePlayPause();
            updatePlayPauseButton();
        }
        
        function isDarkColor(color) {
            if (color.startsWith('#')) {
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);
                const brightness = (r * 299 + g * 587 + b * 114) / 1000;
                return brightness < 128;
            }
            return true;
        }

        // ============================================
        // FULL AR MODE (unchanged from previous version)
        // ============================================

        let stage = null;
        let renderer = null;
        let mindarThree = null;
        let arCamera = null;
        let webCamera = null;
        let scene = null;
        let videoElement = null;
        let videoTexture = null;
        let videoPlane = null;
        let object3D = null;
        let pannerNode = null;
        let arAudioContext = null;
        let arCurrentSource = null;
        let arAudioTreePlayer = null;

        async function initARMode() {
            console.log('Initializing Full AR mode...');
            
            audioModeEl.style.display = 'none';
            arContainerEl.classList.add('active');
            
            localStorage.setItem(TEST_MODE_KEY, 'true');
            testModeToggle.classList.add('hidden');
            
            arAudioContext = new (window.AudioContext || window.webkitAudioContext)();
            pannerNode = arAudioContext.createStereoPanner();
            pannerNode.connect(arAudioContext.destination);
            
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio || 1);
            arContainerEl.appendChild(renderer.domElement);
            
            stage = new THREE.Group();
            
            videoElement = document.createElement('video');
            videoElement.loop = true;
            videoElement.muted = true;
            videoElement.playsInline = true;
            videoElement.crossOrigin = 'anonymous';
            videoElement.src = APP_CONFIG.ar.videoSrc || 'video/overlay.webm';
            
            videoTexture = new THREE.VideoTexture(videoElement);
            videoTexture.colorSpace = THREE.SRGBColorSpace;
            videoTexture.format = THREE.RGBAFormat;
            videoTexture.transparent = true;
            
            const videoMaterial = new THREE.MeshBasicMaterial({ 
                map: videoTexture, 
                transparent: true 
            });
            createARVideoPlane(videoMaterial);
            createAR3DObject();
            setupARLighting();
            
            await initARWebMode();
            setupAREventListeners();
            
            document.getElementById('ar-button').disabled = false;
            document.getElementById('ar-button').textContent = UI_TEXT.startARButton || 'Start AR';
            document.getElementById('next-button-ar').textContent = UI_TEXT.nextButtonAR || 'Next Track';
            document.getElementById('back-button').textContent = UI_TEXT.backButton || 'Back to Audio';
            document.getElementById('mode-label').textContent = UI_TEXT.web3DLabel || 'Web 3D';
            
            arAudioTreePlayer = new AudioTreePlayer(AUDIO_TREE, APP_CONFIG);
            await arAudioTreePlayer.preload();
            
            console.log('Full AR mode ready.');
            arAnimate();
        }

        function createARVideoPlane(material) {
            const geometry = new THREE.PlaneGeometry(1, 1);
            videoPlane = new THREE.Mesh(geometry, material);
            videoPlane.position.set(0, 0, 0);
            stage.add(videoPlane);
        }

        function createAR3DObject() {
            const geometry = new THREE.IcosahedronGeometry(0.2, 0);
            const material = new THREE.MeshStandardMaterial({
                color: 0x007aff,
                metalness: 0.7,
                roughness: 0.3
            });
            object3D = new THREE.Mesh(geometry, material);
            object3D.position.set(0, 0.1, 0);
            stage.add(object3D);
        }

        function setupARLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            stage.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 1);
            stage.add(directionalLight);
            const hemisphereLight = new THREE.HemisphereLight(0xffffbb, 0x080820, 0.6);
            stage.add(hemisphereLight);
        }

        async function initARWebMode() {
            console.log('Initializing AR Web 3D mode...');
            scene = new THREE.Scene();
            scene.add(stage);
            webCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            webCamera.position.set(0, 0, 2);
            const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
            const controls = new OrbitControls(webCamera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            scene.background = new THREE.Color(0x111122);
            const gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);
            console.log('AR Web 3D mode ready.');
        }

        async function initARMindAR() {
            console.log('Initializing MindAR...');
            try {
                const { MindARThree } = await import('mind-ar');
                const { MindARImageTarget } = await import('mind-ar-image');
                mindarThree = new MindARThree({
                    container: renderer.domElement,
                    camera: webCamera
                });
                const { loadImageTarget } = await import('mind-ar-image');
                const target = await loadImageTarget(APP_CONFIG.ar.targetSrc || 'targets/tag.mind');
                const arScene = new THREE.Scene();
                arScene.add(stage);
                mindarThree.addAnchor(0, target, arScene);
                await mindarThree.start();
                arCamera = mindarThree.camera;
                document.getElementById('mode-label').textContent = UI_TEXT.arModeLabel || 'AR Mode';
                document.getElementById('fallback-info').classList.remove('show');
                document.querySelector('#fallback-info h3').textContent = UI_TEXT.arNotAvailable || 'AR Not Available';
                document.querySelector('#fallback-info p').textContent = UI_TEXT.arNotAvailableDescription || 'Camera access denied or not supported. Using 3D fallback mode.';
                console.log('MindAR started successfully.');
                return true;
            } catch (error) {
                console.error('Failed to start MindAR:', error);
                document.getElementById('fallback-info').classList.add('show');
                return false;
            }
        }

        function stopARMindAR() {
            if (mindarThree) {
                mindarThree.stop();
                mindarThree = null;
            }
            document.getElementById('mode-label').textContent = UI_TEXT.web3DLabel || 'Web 3D';
        }

        function setupAREventListeners() {
            document.getElementById('ar-button').addEventListener('click', async () => {
                if (arCurrentSource) {
                    arCurrentSource.stop();
                    arCurrentSource.disconnect();
                    arCurrentSource = null;
                }
                const success = await initARMindAR();
                if (!success) stopARMindAR();
            });
            
            document.getElementById('next-button-ar').addEventListener('click', async () => {
                const didAdvance = arAudioTreePlayer.next();
                if (didAdvance) {
                    await arAudioTreePlayer.play();
                } else {
                    arAudioTreePlayer.goTo('start');
                    await arAudioTreePlayer.play();
                }
            });
            
            backButton.addEventListener('click', () => {
                stopARMode();
                initAudioMode();
            });
            
            renderer.domElement.addEventListener('click', () => {
                if (arAudioContext.state === 'suspended') {
                    arAudioContext.resume();
                }
            });
            
            window.addEventListener('resize', () => {
                renderer.setSize(window.innerWidth, window.innerHeight);
                if (webCamera) {
                    webCamera.aspect = window.innerWidth / window.innerHeight;
                    webCamera.updateProjectionMatrix();
                }
                if (arCamera) {
                    arCamera.aspect = window.innerWidth / window.innerHeight;
                    arCamera.updateProjectionMatrix();
                }
            });
        }

        function stopARMode() {
            if (mindarThree) {
                mindarThree.stop();
                mindarThree = null;
            }
            if (arCurrentSource) {
                arCurrentSource.stop();
                arCurrentSource.disconnect();
                arCurrentSource = null;
            }
            if (arAudioTreePlayer) {
                arAudioTreePlayer.cleanup();
                arAudioTreePlayer = null;
            }
            if (renderer && renderer.domElement.parentNode) {
                renderer.domElement.parentNode.removeChild(renderer.domElement);
            }
            renderer = null;
            stage = null;
            scene = null;
            console.log('AR mode stopped.');
        }

        function arAnimate() {
            if (!renderer) return;
            requestAnimationFrame(arAnimate);
            if (videoTexture) videoTexture.needsUpdate = true;
            if (object3D) object3D.rotation.y += 0.01;
            if (pannerNode && object3D) pannerNode.pan.value = object3D.position.x * 0.5;
            if (mindarThree && mindarThree.renderer) {
                mindarThree.renderer.render(mindarThree.scene, mindarThree.camera);
            } else if (scene && webCamera) {
                renderer.render(scene, webCamera);
            }
        }

        // ============================================
        // MODE TOGGLE
        // ============================================

        function toggleTestMode() {
            isTestMode = true;
            localStorage.setItem(TEST_MODE_KEY, 'true');
            testModeToggle.classList.add('hidden');
            initARMode().catch(console.error);
        }

        // ============================================
        // INITIALIZE APPLICATION
        // ============================================

        testModeToggle.addEventListener('click', toggleTestMode);
        nextButtonSimple.addEventListener('click', nextSimpleTrack);
        restartButton.addEventListener('click', restartExperience);
        backButtonSimple.addEventListener('click', backTrack);
        playPauseButton.addEventListener('click', togglePlayPause);
        
        if (isTestMode) {
            testModeToggle.classList.add('hidden');
            initARMode().catch(error => {
                console.error('AR mode failed, falling back to audio:', error);
                initAudioMode();
            });
        } else {
            initAudioMode();
            if (APP_CONFIG.showTestModeToggle !== false) {
                testModeToggle.classList.remove('hidden');
            }
        }
        
        if (document.visibilityState === 'visible') {
            // Already handled
        } else {
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    if (isTestMode || localStorage.getItem(TEST_MODE_KEY) === 'true') {
                        if (!arContainerEl.classList.contains('active')) {
                            initARMode().catch(console.error);
                        }
                    } else {
                        if (audioModeEl.style.display !== 'flex') {
                            initAudioMode();
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
